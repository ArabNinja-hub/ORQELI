name: Deploy GitHub Pages Preview

on:
  push:
    branches:
      - main
      - arena/0d9b663a-orqeli
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build static preview
    runs-on: ubuntu-latest
    outputs:
      pages_build_type: ${{ steps.pages_mode.outputs.build_type }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install workspace dependencies
        run: npm ci --ignore-scripts

      - name: Build ORQELI Education GitHub Pages bundle
        env:
          VITE_BASE_PATH: /ORQELI/
          VITE_STATIC_SANDBOX: 'true'
        run: |
          npm run build -w @orqeli/web
          cp apps/web/dist/index.html apps/web/dist/404.html
          touch apps/web/dist/.nojekyll

      - name: Check repository GitHub Pages source mode
        id: pages_mode
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MODE=$(gh api "repos/${GITHUB_REPOSITORY}/pages" --jq '.build_type' 2>/dev/null || echo "unconfigured")
          echo "build_type=${MODE}" >> "$GITHUB_OUTPUT"
          if [ "${MODE}" != "workflow" ]; then
            {
              echo "### GitHub Pages source switch needed (one-time repo setting)"
              echo " Static bundle built and verified cleanly."
              echo "To publish live to \`https://arabninja-hub.github.io/ORQELI/\`, open **Settings → Pages** (\`https://github.com/${GITHUB_REPOSITORY}/settings/pages\`) and set **Build and deployment → Source** to **GitHub Actions**, then re-run or push."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Configure Pages
        if: steps.pages_mode.outputs.build_type == 'workflow'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.pages_mode.outputs.build_type == 'workflow'
        uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.pages_build_type == 'workflow'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
